<!-- ... extracellular update for advanced paint tools -->
<!DOCTYPE html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Texture Pack Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- JSZip for exporting and importing zip packs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        pixel: ['"Press Start 2P"', 'monospace'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        .pixelated {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e2f;
        }
        ::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #718096;
        }

        /* Enhanced Winter Snowfall Animation */
        @keyframes snowfall {
            0% { transform: translateY(-15px) translateX(0) rotate(0deg); opacity: 0.9; }
            50% { transform: translateY(50vh) translateX(25px) rotate(180deg); opacity: 1; }
            100% { transform: translateY(105vh) translateX(-20px) rotate(360deg); opacity: 0.2; }
        }
        .snowflake {
            position: fixed;
            top: -20px;
            background: radial-gradient(circle, #ffffff 60%, rgba(186, 230, 253, 0.8) 100%);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 12px rgba(125, 211, 252, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: snowfall linear infinite;
        }

        /* Pixel Grid Overlay */
        .pixel-grid {
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        }
    </style>
</head>
<body id="appBody" class="h-full bg-slate-900 text-slate-100 font-sans flex flex-col overflow-hidden transition-colors duration-300">

    <header id="appHeader" class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shrink-0 shadow-lg transition-colors duration-300">
        <div class="flex items-center space-x-3">
            <label id="dropZone" class="cursor-pointer px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold rounded-lg transition shadow-lg shadow-indigo-900/30 flex items-center space-x-2 border border-indigo-500">
                <input type="file" id="packZipUpload" accept=".zip" class="hidden" onchange="handlePackZipUpload(event)">
                <i class="fa-solid fa-file-zipper"></i>
                <span class="hidden sm:inline">Pack (.zip) Yükle / Sürükle</span>
            </label>
            <button onclick="openPackInfoModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-lg transition border border-slate-600 flex items-center space-x-2">
                <i class="fa-solid fa-gear"></i>
                <span class="hidden sm:inline">Paket Bilgileri</span>
            </button>
            <button onclick="exportTexturePack()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-bold rounded-lg transition shadow-lg shadow-emerald-900/30 flex items-center space-x-2 border border-emerald-500">
                <i class="fa-solid fa-download"></i>
                <span>Pack İndir (.zip)</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden" id="mainDropZone">
        
        <aside class="w-72 bg-slate-800/80 border-r border-slate-700 flex flex-col shrink-0 hidden md:flex">
            <div class="p-4 border-b border-slate-700 space-y-3">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Blok veya eşya ara..." oninput="filterTextures()" class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-1" id="categoryList">
                <button onclick="selectCategory('all')" id="cat-all" class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition bg-emerald-600 text-white flex items-center justify-between shadow-md">
                    <span><i class="fa-solid fa-layer-group w-6"></i> Tüm Dosyalar</span>
                    <span class="text-xs bg-emerald-700 px-2 py-0.5 rounded-full" id="count-all">0</span>
                </button>
                <button onclick="selectCategory('block')" id="cat-block" class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-700/60 flex items-center justify-between">
                    <span><i class="fa-solid fa-cube w-6 text-emerald-400"></i> Bloklar (Blocks)</span>
                    <span class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-slate-400" id="count-block">0</span>
                </button>
                <button onclick="selectCategory('item')" id="cat-item" class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-700/60 flex items-center justify-between">
                    <span><i class="fa-solid fa-shield-halved w-6 text-amber-400"></i> Eşyalar (Items)</span>
                    <span class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-slate-400" id="count-item">0</span>
                </button>
                <button onclick="selectCategory('environment')" id="cat-environment" class="w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-700/60 flex items-center justify-between">
                    <span><i class="fa-solid fa-cloud-sun w-6 text-sky-400"></i> Çevre (Environment)</span>
                    <span class="text-xs bg-slate-700 px-2 py-0.5 rounded-full text-slate-400" id="count-environment">0</span>
                </button>
            </div>

            <div id="sidebarFooter" class="p-4 border-t border-slate-700 bg-slate-900/45 transition-colors duration-300">
                <div class="space-y-3">
                    <a href="https://namemc.com/profile/zartheusMC.1" target="_blank" class="w-full py-2.5 px-3 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-emerald-900/20 flex items-center justify-center space-x-2 border border-emerald-500/50">
                        <i class="fa-solid fa-user-shield text-emerald-200"></i>
                        <span>Made By Zartheus</span>
                    </a>
                    
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                            <span><i class="fa-solid fa-palette text-emerald-400 mr-1"></i> Arayüz Modu</span>
                        </label>
                        <div class="grid grid-cols-3 gap-1.5 bg-slate-950/60 p-1 rounded-1xl border border-slate-700/60">
                            <button onclick="setThemeMode('dark')" id="modeBtn-dark" title="Gece Modu" class="py-2 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1 bg-emerald-600 text-white shadow">
                                <i class="fa-solid fa-moon"></i>
                                <span class="hidden sm:inline">Koyu</span>
                            </button>
                            <button onclick="setThemeMode('light')" id="modeBtn-light" title="Aydınlık Mod" class="py-2 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1 text-slate-400 hover:text-slate-200">
                                <i class="fa-solid fa-sun"></i>
                                <span class="hidden sm:inline">Aydınlık</span>
                            </button>
                            <button onclick="setThemeMode('winter')" id="modeBtn-winter" title="Kış Modu (Kar Yağışlı)" class="py-2 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1 text-sky-300 hover:text-sky-100">
                                <i class="fa-solid fa-snowflake animate-spin"></i>
                                <span class="hidden sm:inline">Kış</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <main id="mainContainer" class="flex-1 flex flex-col overflow-hidden bg-slate-950 transition-colors duration-300">
            <div id="subHeader" class="bg-slate-900/80 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 transition-colors duration-300">
                <div class="flex items-center space-x-2 text-sm text-slate-300" id="subHeaderTitleGroup">
                    <span id="currentCategoryTitle" class="font-bold text-white">Tüm Dosyalar</span>
                    <span class="text-slate-500">•</span>
                    <span id="itemCountDisplay" class="text-slate-400">0 dosya listeleniyor</span>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="openCreateCustomFileDialog()" class="cursor-pointer px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg transition shadow flex items-center space-x-2 border border-emerald-600">
                        <i class="fa-solid fa-plus"></i>
                        <span>Kendi Dosyanı Üret</span>
                    </button>
                    <label class="cursor-pointer px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium rounded-lg transition border border-slate-700 flex items-center space-x-2">
                        <input type="file" id="globalImageUpload" accept="image/png" multiple class="hidden" onchange="handleMultiplePngUpload(event)">
                        <i class="fa-solid fa-file-arrow-up text-emerald-400"></i>
                        <span>Tekli / Çoklu .png Ekle</span>
                    </label>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6">
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4" id="textureGrid">
                    <!-- Cards populated via JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- ADVANCED EDITOR MODAL -->
    <div id="editorModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-6xl shadow-2xl flex flex-col overflow-hidden max-h-[95vh]">
            <!-- Modal Header -->
            <div class="bg-slate-800 px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div id="modalItemIcon" class="w-10 h-10 bg-slate-900 rounded-lg p-1 border border-slate-700 flex items-center justify-center"></div>
                    <div>
                        <h3 id="modalItemName" class="font-bold text-white text-base">grass_block.png</h3>
                        <p id="modalItemPath" class="text-xs text-slate-400">assets/minecraft/textures/block/grass_block.png</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- Resolution Selector dropdown inside Editor Header -->
                    <div class="flex items-center space-x-2 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-700">
                        <span class="text-xs text-slate-400">Çözünürlük:</span>
                        <select id="resolutionSelector" onchange="changeCanvasResolution(this.value)" class="bg-slate-800 text-emerald-400 text-xs font-bold rounded px-2 py-1 outline-none border border-slate-700 cursor-pointer">
                            <option value="8">8x8 (Retro)</option>
                            <option value="16" selected>16x16 (Standart)</option>
                            <option value="32">32x32 (HD)</option>
                            <option value="64">64x64 (Ultra HD)</option>
                            <option value="128">128x128 (Modern)</option>
                        </select>
                    </div>
                    <button onclick="closeEditor()" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-slate-700 transition">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
                <!-- Canvas Workspace -->
                <div class="flex-1 bg-slate-950 p-6 flex flex-col items-center justify-center relative overflow-auto" id="editorDropZone">
                    <!-- Canvas wrapper with optional pixel grid -->
                    <div id="canvasWrapper" class="border-2 border-slate-700 shadow-2xl rounded bg-slate-900 p-3 relative flex items-center justify-center max-w-full max-h-[60vh] overflow-auto pixel-grid">
                        <canvas id="paintCanvas" class="pixelated cursor-crosshair shadow-inner"></canvas>
                    </div>
                    <div class="mt-4 flex flex-wrap items-center justify-center gap-4 text-xs text-slate-400">
                        <span><kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300">Sol Tık</kbd> Çiz</span>
                        <span><kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300">Sağ Tık</kbd> Pipet</span>
                        <span><kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300">Ctrl + Z</kbd> Geri Al</span>
                        <span><kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-slate-300">Ctrl + Y</kbd> İleri Al</span>
                    </div>
                </div>

                <!-- Expanded Tools & Paint Features Sidebar -->
                <div class="w-full md:w-80 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-700 p-5 flex flex-col space-y-4 overflow-y-auto shrink-0">
                    
                    <!-- History Buttons -->
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Çizim Geçmişi</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="undoAction()" id="undoBtn" disabled class="py-2 px-3 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 text-xs rounded-lg transition flex items-center justify-center space-x-1 border border-slate-700">
                                <i class="fa-solid fa-rotate-left mr-1"></i> Geri Al
                            </button>
                            <button onclick="redoAction()" id="redoBtn" disabled class="py-2 px-3 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-200 text-xs rounded-lg transition flex items-center justify-center space-x-1 border border-slate-700">
                                İleri Al <i class="fa-solid fa-rotate-right ml-1"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Drawing Tools Grid (Expanded) -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Çizim Araçları</label>
                            <button onclick="togglePixelGrid()" id="gridToggleBtn" class="text-[11px] text-emerald-400 hover:underline flex items-center space-x-1">
                                <i class="fa-solid fa-border-all"></i> <span id="gridToggleText">Klavuz Çizgisi: Açık</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-4 gap-1.5">
                            <button onclick="setTool('pencil')" id="tool-pencil" title="Kalem" class="p-2.5 bg-emerald-600 text-white rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-emerald-500 shadow-md">
                                <i class="fa-solid fa-pencil text-sm"></i>
                                <span class="text-[9px]">Kalem</span>
                            </button>
                            <button onclick="setTool('eraser')" id="tool-eraser" title="Silgi" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-slate-700">
                                <i class="fa-solid fa-eraser text-sm"></i>
                                <span class="text-[9px]">Silgi</span>
                            </button>
                            <button onclick="setTool('fill')" id="tool-fill" title="Kova (Boyama)" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-slate-700">
                                <i class="fa-solid fa-fill-drip text-sm"></i>
                                <span class="text-[9px]">Kova</span>
                            </button>
                            <button onclick="setTool('picker')" id="tool-picker" title="Pipet (Renk Seç)" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-slate-700">
                                <i class="fa-solid fa-eye-dropper text-sm"></i>
                                <span class="text-[9px]">Pipet</span>
                            </button>
                            <button onclick="setTool('line')" id="tool-line" title="Çizgi" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-slate-700">
                                <i class="fa-solid fa-slash text-sm"></i>
                                <span class="text-[9px]">Çizgi</span>
                            </button>
                            <button onclick="setTool('rect')" id="tool-rect" title="Dikdörtgen" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-slate-700">
                                <i class="fa-regular fa-square text-sm"></i>
                                <span class="text-[9px]">Kutu</span>
                            </button>
                            <button onclick="setTool('circle')" id="tool-circle" title="Çember" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-slate-700">
                                <i class="fa-regular fa-circle text-sm"></i>
                                <span class="text-[9px]">Çember</span>
                            </button>
                            <button onclick="setTool('lighten')" id="tool-lighten" title="Parlatıcı (Açık Ton)" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-slate-700">
                                <i class="fa-solid fa-sun text-sm text-amber-300"></i>
                                <span class="text-[9px]">Parlat</span>
                            </button>
                        </div>
                    </div>

                    <!-- Active Color & Shading Adjuster -->
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Aktif Renk & Ton</label>
                        <div class="flex items-center space-x-3 bg-slate-800 p-3 rounded-xl border border-slate-700">
                            <input type="color" id="colorPicker" value="#55a030" onchange="updateColor(this.value)" class="w-10 h-10 rounded cursor-pointer bg-transparent border-0">
                            <div class="flex-1 flex flex-col space-y-1">
                                <input type="text" id="colorHexText" value="#55a030" onchange="updateColor(this.value)" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 font-mono">
                                <div class="flex items-center space-x-1 pt-0.5">
                                    <button onclick="adjustCurrentColorBrightness(-20)" title="Tonu Karart" class="flex-1 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 text-[10px] rounded border border-slate-700">Karart (-)</button>
                                    <button onclick="adjustCurrentColorBrightness(20)" title="Tonu Aç / Parlat" class="flex-1 py-1 bg-slate-900 hover:bg-slate-700 text-slate-300 text-[10px] rounded border border-slate-700">Aç (+)</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Minecraft Quick Palette -->
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Minecraft Paleti</label>
                        <div class="grid grid-cols-6 gap-1.5" id="quickPalette"></div>
                    </div>

                    <!-- Canvas Operations (Flip / Rotate / Invert) -->
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block">Gelişmiş İşlemler</label>
                        <div class="grid grid-cols-3 gap-1.5">
                            <button onclick="canvasOperation('h-flip')" title="Yatay Çevir" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] rounded-lg border border-slate-700 flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-arrows-left-right text-emerald-400"></i> <span>Yatay Çevir</span>
                            </button>
                            <button onclick="canvasOperation('v-flip')" title="Dikey Çevir" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] rounded-lg border border-slate-700 flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-arrows-up-down text-emerald-400"></i> <span>Dikey Çevir</span>
                            </button>
                            <button onclick="canvasOperation('invert')" title="Renkleri Ters Çevir" class="py-1.5 px-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] rounded-lg border border-slate-700 flex items-center justify-center space-x-1">
                                <i class="fa-solid fa-wand-magic-sparkles text-amber-400"></i> <span>Negatif</span>
                            </button>
                        </div>
                    </div>

                    <!-- Modal Actions Footer -->
                    <div class="pt-2 border-t border-slate-800 mt-auto flex space-x-3">
                        <button onclick="resetCurrentTexture()" class="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-medium rounded-lg transition border border-slate-700">
                            Sıfırla
                        </button>
                        <button onclick="saveCurrentTexture()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-lg transition shadow-md border border-emerald-500">
                            Kaydet
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PACK INFO MODAL -->
    <div id="packInfoModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl p-6 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="font-bold text-white text-base">Kaynak Paketi Bilgileri</h3>
                <button onclick="closePackInfoModal()" class="text-slate-400 hover:text-white p-1 rounded">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-medium text-slate-300 mb-1 block">Paket Adı</label>
                    <input type="text" id="packNameInput" value="Benim Muhtesem Packim" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-300 mb-1 block">Paket Açıklaması (Description)</label>
                    <textarea id="packDescInput" rows="3" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">MC Texture Studio ile düzenlendi!</textarea>
                </div>
                <div>
                    <label class="text-xs font-medium text-slate-300 mb-1 block">Minecraft Sürüm Formatı (pack_format)</label>

            </div>
        </div>
    </div>

    <!-- CREATE CUSTOM FILE MODAL -->
    <div id="createCustomFileDialog" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl p-6 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="font-bold text-white text-base flex items-center space-x-2">
                    <i class="fa-solid fa-paintbrush text-emerald-400"></i>
                    <span>Yeni Özel Doku Oluştur</span>
                </h3>
                <button onclick="closeCreateCustomFileDialog()" class="text-slate-400 hover:text-white p-1 rounded">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs font-medium text-slate-300 mb-1 block">Dosya Adı (.png hariç)</label>
                    <input type="text" id="customFileNameInput" placeholder="örnek: super_sword, ozel_kilic" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500 font-mono">
                </div>

                    <label class="text-xs font-medium text-slate-300 mb-1 block">Kategori</label>

                        <option value="item" selected>Eşya (Item)</option>
                        <option value="environment">Çevre (Environment)</option>

                    <label class="text-xs font-medium text-slate-300 mb-1 block">Başlangıç Çözünürlüğü</label>
                    <select id="customFileResInput" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500">
                        <option value="8">8x8 (Retro)</option>
                        <option value="16" selected>16x16 (Standart)</option>

                        <option value="64">64x64 (Ultra HD)</option>

    <script>
        let texturesDB = [
        ];

        let modifiedTextures = {}; 
        let defaultTexturesBackup = {}; 
        let currentCategory = 'all';
        let currentSearchQuery = '';
        let currentTheme = 'dark'; // dark, light, winter
        let winterInterval = null;

        // Editor & History State
        let activeTextureId = null;
        let activeTool = 'pencil'; // pencil, eraser, fill, picker, line, rect, circle, lighten
        let currentColor = '#55a030';
        let canvas, ctx;
        let isDrawing = false;
        let startX = 0, startY = 0;
        let snapshotDataUrl = null;
        let showGrid = true;

        // Robust Undo / Redo history stacks
        let undoStack = [];
        let redoStack = [];
        let isPerformingHistoryAction = false;

        const minecraftPalette = [
            '#ffffff', '#c7c7c7', '#858585', '#4d4d4d', '#1a1a1a', '#000000',
            '#ff5555', '#ffb833', '#ffff55', '#55ff55', '#55ffff', '#5555ff',
            '#ff55ff', '#aa0000', '#aa5500', '#aaaa00', '#00aa00', '#00aaaa',
            '#0000aa', '#aa00aa', '#866043', '#55a030', '#737373', '#3ef8ff'
        ];

        function initTextures() {
            renderGrid();
            updateCounts();
            initPaletteUI();
            setupGlobalKeyboardShortcuts();
            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const dropArea = document.getElementById('mainDropZone');
            
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropArea.addEventListener(eventName, preventDefaults, false);
                document.body.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            dropArea.addEventListener('drop', handleDrop, false);

            const editorDropArea = document.getElementById('editorDropZone');
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                editorDropArea.addEventListener(eventName, preventDefaults, false);
            });
            editorDropArea.addEventListener('drop', handleEditorDrop, false);
        }

        function handleEditorDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (!files || files.length === 0) return;
            const file = files[0];
            if (!file.name.endsWith('.png')) {
                alertCustom("Lütfen geçerli bir .png dosyası sürükleyin.");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(evt) {
                pushHistoryState();
                setupCanvas(evt.target.result);
                alertCustom("PNG dosyası boyama alanına yüklendi!");
            };
            reader.readAsDataURL(file);
        }

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (!files || files.length === 0) return;

            const firstFile = files[0];
            if (firstFile.name.endsWith('.zip')) {
                handlePackZipUploadDrop(firstFile);
            } else {
                handleMultiplePngUploadDrop(files);
            }
        }

        async function handlePackZipUploadDrop(file) {
            try {
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);
                let count = 0;

                texturesDB = [];
                modifiedTextures = {};
                defaultTexturesBackup = {};

                for (let relativePath of Object.keys(zipContent.files)) {
                    if (relativePath.endsWith('.png') && !zipContent.files[relativePath].dir) {
                        const pathParts = relativePath.split('/');
                        const fileNameWithExt = pathParts[pathParts.length - 1];
                        const id = fileNameWithExt.replace('.png', '');

                        let category = 'block';
                        if (relativePath.includes('/item/')) category = 'item';
                        else if (relativePath.includes('/environment/')) category = 'environment';

                        const blob = await zipContent.files[relativePath].async('blob');
                        const dataUrl = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(blob);
                        });

                        texturesDB.push({
                            id: id,
                            name: fileNameWithExt,
                            category: category,
                            path: relativePath
                        });
                        modifiedTextures[id] = dataUrl;
                        defaultTexturesBackup[id] = dataUrl;
                        count++;
                    }
                }

                renderGrid();
                updateCounts();
                alertCustom(`Sürüklenen yeni paket başarıyla yüklendi! (${count} dosya)`);
            } catch (err) {
                console.error("ZIP yükleme hatası:", err);
                alertCustom("Geçerli bir .zip dosyası sürükleyin.");
            }
        }

        function handleMultiplePngUploadDrop(files) {
            let loadedCount = 0;
            Array.from(files).forEach(file => {
                if (!file.name.endsWith('.png')) return;
                const rawName = file.name.toLowerCase().replace('.png', '');
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    let matchedItem = texturesDB.find(i => i.id === rawName);
                    if (matchedItem) {
                        modifiedTextures[matchedItem.id] = dataUrl;
                    } else {
                        const newId = rawName.replace(/[^a-z0-9_]/g, '_');
                        texturesDB.push({
                            id: newId,
                            name: file.name,
                            category: 'block',
                            path: `assets/minecraft/textures/block/${file.name}`
                        });
                        modifiedTextures[newId] = dataUrl;
                        defaultTexturesBackup[newId] = dataUrl;
                    }
                    loadedCount++;
                    if (loadedCount === files.length) {
                        renderGrid();
                        updateCounts();
                        alertCustom(`${loadedCount} dosya sürüklenip eklendi!`);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function setupGlobalKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key.toLowerCase() === 'z') {
                    if (document.getElementById('editorModal').classList.contains('hidden')) return;
                    e.preventDefault();
                    if (e.shiftKey) {
                        redoAction();
                    } else {
                        undoAction();
                    }
                } else if (e.ctrlKey && e.key.toLowerCase() === 'y') {
                    if (document.getElementById('editorModal').classList.contains('hidden')) return;
                    e.preventDefault();
                    redoAction();
                }
            });
        }

        function renderGrid() {
            const grid = document.getElementById('textureGrid');
            grid.innerHTML = '';

            const filtered = texturesDB.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.name.toLowerCase().includes(currentSearchQuery.toLowerCase()) || item.id.toLowerCase().includes(currentSearchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            document.getElementById('itemCountDisplay').textContent = `${filtered.length} dosya listeleniyor`;

            if (texturesDB.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-20 text-center text-slate-400 flex flex-col items-center justify-center space-y-4">
                        <div class="w-16 h-16 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-center text-emerald-400 text-2xl shadow-xl">
                            <i class="fa-solid fa-file-zipper"></i>
                        </div>
                        <div class="space-y-1">
                            <h4 class="font-bold text-white text-base">Henüz hiçbir doku yüklenmedi</h4>
                            <p class="text-xs text-slate-400 max-w-sm">Başlamak için sol üstten bir <span class="text-indigo-400 font-semibold">.zip</span> kaynak paketi yükleyin veya bilgisayarınızdan tekli/çoklu <span class="text-emerald-400 font-semibold">.png</span> dosyaları ekleyin.</p>
                        </div>
                        <label class="cursor-pointer px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-xl transition shadow-lg shadow-indigo-900/30 flex items-center space-x-2 border border-indigo-500 mt-2">
                            <input type="file" id="packZipUploadEmpty" accept=".zip" class="hidden" onchange="handlePackZipUpload(event)">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span>Pack (.zip) veya PNG Yükle</span>
                        </label>
                    </div>
                `;
                return;
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center text-slate-500 flex flex-col items-center justify-center space-y-3">
                        <i class="fa-solid fa-box-open text-4xl"></i>
                        <p class="text-sm">Aradığınız kriterlere uygun doku bulunamadı.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(item => {
                const dataUrl = modifiedTextures[item.id];
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 hover:border-emerald-500/50 rounded-xl p-3 flex flex-col items-center transition group cursor-pointer shadow-lg hover:shadow-emerald-950/20 relative";
                
                card.innerHTML = `
                    <button onclick="event.stopPropagation(); deleteTexture('${item.id}')" title="Dosyayı Sil" class="absolute top-2 left-2 opacity-0 group-hover:opacity-100 transition bg-rose-600 hover:bg-rose-500 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow z-10">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    <div onclick="openEditor('${item.id}')" class="w-full aspect-square bg-slate-950 rounded-lg border border-slate-800 flex items-center justify-center p-4 mb-3 overflow-hidden group-hover:bg-slate-900/80 transition">
                        <img src="${dataUrl}" class="w-24 h-24 pixelated drop-shadow-md group-hover:scale-110 transition duration-200" alt="${item.name}">
                    </div>
                    <span onclick="openEditor('${item.id}')" class="font-medium text-xs text-slate-200 text-center truncate w-full mb-1">${item.name}</span>
                    <span onclick="openEditor('${item.id}')" class="text-[10px] text-slate-500 font-mono truncate w-full text-center">${item.id}.png</span>
                    <div onclick="openEditor('${item.id}')" class="absolute top-2 right-2 opacity-0 group-hover:opacity-100 transition bg-emerald-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow">
                        <i class="fa-solid fa-pen"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function deleteTexture(id) {
            if (texturesDB.length <= 1) {
                alertCustom("Pakette en az 1 dosya kalmalıdır!");
                return;
            }
            texturesDB = texturesDB.filter(item => item.id !== id);
            delete modifiedTextures[id];
            delete defaultTexturesBackup[id];
            renderGrid();
            updateCounts();
            alertCustom("Dosya başarıyla silindi!");
        }

        function updateCounts() {
            document.getElementById('count-all').textContent = texturesDB.length;
            document.getElementById('count-block').textContent = texturesDB.filter(i => i.category === 'block').length;
            document.getElementById('count-item').textContent = texturesDB.filter(i => i.category === 'item').length;
            document.getElementById('count-environment').textContent = texturesDB.filter(i => i.category === 'environment').length;
        }

        function selectCategory(cat) {
            currentCategory = cat;
            ['all', 'block', 'item', 'environment'].forEach(c => {
                const btn = document.getElementById(`cat-${c}`);
                if (c === cat) {
                    btn.className = "w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition bg-emerald-600 text-white flex items-center justify-between shadow-md";
                } else {
                    btn.className = "w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-700/60 flex items-center justify-between";
                }
            });
            const titles = { all: 'Tüm Dosyalar', block: 'Bloklar', item: 'Eşyalar', environment: 'Çevre' };
            document.getElementById('currentCategoryTitle').textContent = titles[cat];
            renderGrid();
        }

        function filterTextures() {
            currentSearchQuery = document.getElementById('searchInput').value;
            renderGrid();
        }

        function openEditor(id) {
            activeTextureId = id;
            const item = texturesDB.find(i => i.id === id);
            if (!item) return;

            document.getElementById('modalItemName').textContent = `${item.id}.png`;
            document.getElementById('modalItemPath').textContent = item.path;
            document.getElementById('modalItemIcon').innerHTML = `<img src="${modifiedTextures[id]}" class="w-8 h-8 pixelated">`;

            document.getElementById('editorModal').classList.remove('hidden');
            setupCanvas(modifiedTextures[id]);
        }

        function closeEditor() {
            document.getElementById('editorModal').classList.add('hidden');
            activeTextureId = null;
            renderGrid();
        }

        function setupCanvas(dataUrl) {
            canvas = document.getElementById('paintCanvas');
            ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            const img = new Image();
            img.onload = () => {
                const width = img.naturalWidth || 16;
                const height = img.naturalHeight || 16;
                
                canvas.width = width;
                canvas.height = height;
                
                document.getElementById('resolutionSelector').value = width.toString();

                const displaySize = Math.max(256, Math.min(512, width * 16));
                canvas.style.width = `${displaySize}px`;
                canvas.style.height = `${displaySize}px`;

                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);

                undoStack = [canvas.toDataURL()];
                redoStack = [];
                updateUndoRedoButtons();
            };
            img.src = dataUrl;

            canvas.onmousedown = startDrawing;
            canvas.onmousemove = draw;
            canvas.onmouseup = stopDrawing;

            canvas.ontouchstart = (e) => { e.preventDefault(); startDrawing(e.touches[0]); };
            canvas.ontouchmove = (e) => { e.preventDefault(); draw(e.touches[0]); };
            canvas.ontouchend = stopDrawing;
        }

        function changeCanvasResolution(newRes) {
            const size = parseInt(newRes, 10);
            if (!canvas || isNaN(size)) return;

            const oldDataUrl = canvas.toDataURL();
            const tempImg = new Image();
            tempImg.onload = () => {
                pushHistoryState();

                canvas.width = size;
                canvas.height = size;

                const displaySize = Math.max(256, Math.min(512, size * 16));
                canvas.style.width = `${displaySize}px`;
                canvas.style.height = `${displaySize}px`;

                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, size, size);
                ctx.drawImage(tempImg, 0, 0, size, size);
                
                pushHistoryState();
            };
            tempImg.src = oldDataUrl;
        }

        function pushHistoryState() {
            if (!canvas || isPerformingHistoryAction) return;
            const dataUrl = canvas.toDataURL();
            if (undoStack.length > 0 && undoStack[undoStack.length - 1] === dataUrl) return;
            undoStack.push(dataUrl);
            if (undoStack.length > 50) {
                undoStack.shift();
            }
            redoStack = [];
            updateUndoRedoButtons();
        }

        function undoAction() {
            if (undoStack.length <= 1) return;
            isPerformingHistoryAction = true;
            const currentState = undoStack.pop();
            redoStack.push(currentState);
            const prevState = undoStack[undoStack.length - 1];
            restoreCanvasState(prevState, () => {
                isPerformingHistoryAction = false;
                updateUndoRedoButtons();
            });
        }

        function redoAction() {
            if (redoStack.length === 0) return;
            isPerformingHistoryAction = true;
            const nextState = redoStack.pop();
            undoStack.push(nextState);
            restoreCanvasState(nextState, () => {
                isPerformingHistoryAction = false;
                updateUndoRedoButtons();
            });
        }

        function restoreCanvasState(dataUrl, callback) {
            const img = new Image();
            img.onload = () => {
                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                if (callback) callback();
            };
            img.src = dataUrl;
        }

        function updateUndoRedoButtons() {
            const undoBtn = document.getElementById('undoBtn');
            const redoBtn = document.getElementById('redoBtn');
            if (undoBtn) undoBtn.disabled = undoStack.length <= 1;
            if (redoBtn) redoBtn.disabled = redoStack.length === 0;
        }

        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.clientX !== undefined ? e.clientX : e.pageX;
            const clientY = e.clientY !== undefined ? e.clientY : e.pageY;
            const x = Math.floor((clientX - rect.left) * scaleX);
            const y = Math.floor((clientY - rect.top) * scaleY);
            return { x: Math.max(0, Math.min(canvas.width - 1, x)), y: Math.max(0, Math.min(canvas.height - 1, y)) };
        }

        function startDrawing(e) {
            if (e.button === 2) { // Right click -> color picker
                const coords = getCanvasCoords(e);
                pickColorAt(coords.x, coords.y);
                return;
            }

            const coords = getCanvasCoords(e);
            startX = coords.x;
            startY = coords.y;

            if (activeTool === 'fill') {
                pushHistoryState();
                floodFill(startX, startY, currentColor);
                pushHistoryState();
                return;
            }

            if (activeTool === 'line' || activeTool === 'rect' || activeTool === 'circle') {
                snapshotDataUrl = canvas.toDataURL();
            }

            pushHistoryState();
            isDrawing = true;
            applyToolAt(coords);
        }

        function draw(e) {
            if (!isDrawing) return;
            const coords = getCanvasCoords(e);

            if (activeTool === 'line' || activeTool === 'rect' || activeTool === 'circle') {
                // Restore pristine snapshot before rendering live preview of shape
                const img = new Image();
                img.onload = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    renderShapePreview(startX, startY, coords.x, coords.y);
                };
                img.src = snapshotDataUrl;
            } else {
                applyToolAt(coords);
            }
        }

        function stopDrawing(e) {
            if (isDrawing) {
                isDrawing = false;
                if ((activeTool === 'line' || activeTool === 'rect' || activeTool === 'circle') && e) {
                    const coords = getCanvasCoords(e);
                    renderShapePreview(startX, startY, coords.x, coords.y, true);
                }
                pushHistoryState();
            }
        }

        function applyToolAt(coords) {
            if (activeTool === 'pencil') {
                ctx.fillStyle = currentColor;
                ctx.fillRect(coords.x, coords.y, 1, 1);
            } else if (activeTool === 'eraser') {
                ctx.clearRect(coords.x, coords.y, 1, 1);
            } else if (activeTool === 'picker') {
                pickColorAt(coords.x, coords.y);
            } else if (activeTool === 'lighten') {
                adjustPixelBrightness(coords.x, coords.y, 25);
            }
        }

        function pickColorAt(x, y) {
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            if (pixel[3] > 0) {
                const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
                updateColor(hex);
                setTool('pencil');
                alertCustom(`Renk seçildi: ${hex}`);
            }
        }

        // Flood Fill algorithm for paint bucket
        function floodFill(x, y, fillColorHex) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const width = canvas.width;
            const height = canvas.height;

            const targetIdx = (y * width + x) * 4;
            const targetR = data[targetIdx];
            const targetG = data[targetIdx + 1];
            const targetB = data[targetIdx + 2];
            const targetA = data[targetIdx + 3];

            const rgb = hexToRgb(fillColorHex);
            const r = rgb.r, g = rgb.g, b = rgb.b, a = 255;

            if (targetR === r && targetG === g && targetB === b && targetA === a) return;

            const queue = [[x, y]];
            const visited = new Uint8Array(width * height);

            while (queue.length > 0) {
                const [cx, cy] = queue.pop();
                if (cx < 0 || cx >= width || cy < 0 || cy >= height) continue;
                const idx = cy * width + cx;
                if (visited[idx]) continue;
                visited[idx] = 1;

                const currIdx = (cy * width + cx) * 4;
                if (
                    data[currIdx] === targetR &&
                    data[currIdx + 1] === targetG &&
                    data[currIdx + 2] === targetB &&
                    data[currIdx + 3] === targetA
                ) {
                    data[currIdx] = r;
                    data[currIdx + 1] = g;
                    data[currIdx + 2] = b;
                    data[currIdx + 3] = a;

                    queue.push([cx + 1, cy]);
                    queue.push([cx - 1, cy]);
                    queue.push([cx, cy + 1]);
                    queue.push([cx, cy - 1]);
                }
            }
            ctx.putImageData(imgData, 0, 0);
        }

        function renderShapePreview(x0, y0, x1, y1, commit = false) {
            ctx.fillStyle = currentColor;
            if (activeTool === 'line') {
                drawLinePixels(x0, y0, x1, y1);
            } else if (activeTool === 'rect') {
                const minX = Math.min(x0, x1);
                const maxX = Math.max(x0, x1);
                const minY = Math.min(y0, y1);
                const maxY = Math.max(y0, y1);
                for (let x = minX; x <= maxX; x++) {
                    ctx.fillRect(x, minY, 1, 1);
                    ctx.fillRect(x, maxY, 1, 1);
                }
                for (let y = minY; y <= maxY; y++) {
                    ctx.fillRect(minX, y, 1, 1);
                    ctx.fillRect(maxX, y, 1, 1);
                }
            } else if (activeTool === 'circle') {
                const radius = Math.round(Math.hypot(x1 - x0, y1 - y0));
                drawCirclePixels(x0, y0, radius);
            }
        }

        function drawLinePixels(x0, y0, x1, y1) {
            const dx = Math.abs(x1 - x0);
            const dy = Math.abs(y1 - y0);
            const sx = (x0 < x1) ? 1 : -1;
            const sy = (y0 < y1) ? 1 : -1;
            let err = dx - dy;

            while (true) {
                ctx.fillRect(x0, y0, 1, 1);
                if (x0 === x1 && y0 === y1) break;
                const e2 = 2 * err;
                if (e2 > -dy) {
                    err -= dy;
                    x0 += sx;
                }
                if (e2 < dx) {
                    err += dx;
                    y0 += sy;
                }
            }
        }

        function drawCirclePixels(xc, yc, r) {
            let x = 0;
            let y = r;
            let d = 3 - 2 * r;
            drawCircleSymmetric(xc, yc, x, y);
            while (y >= x) {
                x++;
                if (d > 0) {
                    y--;
                    d = d + 4 * (x - y) + 10;
                } else {
                    d = d + 4 * x + 6;
                }
                drawCircleSymmetric(xc, yc, x, y);
            }
        }

        function drawCircleSymmetric(xc, yc, x, y) {
            ctx.fillRect(xc + x, yc + y, 1, 1);
            ctx.fillRect(xc - x, yc + y, 1, 1);
            ctx.fillRect(xc + x, yc - y, 1, 1);
            ctx.fillRect(xc - x, yc - y, 1, 1);
            ctx.fillRect(xc + y, yc + x, 1, 1);
            ctx.fillRect(xc - y, yc + x, 1, 1);
            ctx.fillRect(xc + y, yc - x, 1, 1);
            ctx.fillRect(xc - y, yc - x, 1, 1);
        }

        function adjustPixelBrightness(x, y, amount) {
            const pixel = ctx.getImageData(x, y, 1, 1);
            const d = pixel.data;
            if (d[3] === 0) return;
            d[0] = Math.min(255, Math.max(0, d[0] + amount));
            d[1] = Math.min(255, Math.max(0, d[1] + amount));
            d[2] = Math.min(255, Math.max(0, d[2] + amount));
            ctx.putImageData(pixel, x, y);
        }

        function adjustCurrentColorBrightness(amount) {
            const rgb = hexToRgb(currentColor);
            rgb.r = Math.min(255, Math.max(0, rgb.r + amount));
            rgb.g = Math.min(255, Math.max(0, rgb.g + amount));
            rgb.b = Math.min(255, Math.max(0, rgb.b + amount));
            updateColor(rgbToHex(rgb.r, rgb.g, rgb.b));
        }

        // Canvas advanced operations (Flip, Invert)
        function canvasOperation(op) {
            pushHistoryState();
            const w = canvas.width;
            const h = canvas.height;
            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            if (op === 'h-flip') {
                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < Math.floor(w / 2); x++) {
                        const idx1 = (y * w + x) * 4;
                        const idx2 = (y * w + (w - 1 - x)) * 4;
                        for (let i = 0; i < 4; i++) {
                            const tmp = data[idx1 + i];
                            data[idx1 + i] = data[idx2 + i];
                            data[idx2 + i] = tmp;
                        }
                    }
                }
            } else if (op === 'v-flip') {
                for (let y = 0; y < Math.floor(h / 2); y++) {
                    for (let x = 0; x < w; x++) {
                        const idx1 = (y * w + x) * 4;
                        const idx2 = ((h - 1 - y) * w + x) * 4;
                        for (let i = 0; i < 4; i++) {
                            const tmp = data[idx1 + i];
                            data[idx1 + i] = data[idx2 + i];
                            data[idx2 + i] = tmp;
                        }
                    }
                }
            } else if (op === 'invert') {
                for (let i = 0; i < data.length; i += 4) {
                    if (data[i + 3] > 0) {
                        data[i] = 255 - data[i];
                        data[i + 1] = 255 - data[i + 1];
                        data[i + 2] = 255 - data[i + 2];
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
            pushHistoryState();
            alertCustom("İşlem başarıyla uygulandı!");
        }

        function togglePixelGrid() {
            showGrid = !showGrid;
            const wrapper = document.getElementById('canvasWrapper');
            const text = document.getElementById('gridToggleText');
            if (showGrid) {
                wrapper.classList.add('pixel-grid');
                text.textContent = "Klavuz Çizgisi: Açık";
            } else {
                wrapper.classList.remove('pixel-grid');
                text.textContent = "Klavuz Çizgisi: Kapalı";
            }
        }

        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function hexToRgb(hex) {
            const bigint = parseInt(hex.replace('#', ''), 16);
            return {
                r: (bigint >> 16) & 255,
                g: (bigint >> 8) & 255,
                b: bigint & 255
            };
        }

        function setTool(tool) {
            activeTool = tool;
            ['pencil', 'eraser', 'fill', 'picker', 'line', 'rect', 'circle', 'lighten'].forEach(t => {
                const btn = document.getElementById(`tool-${t}`);
                if (btn) {
                    if (t === tool) {
                        btn.className = "p-2.5 bg-emerald-600 text-white rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-emerald-500 shadow-md";
                    } else {
                        btn.className = "p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg flex flex-col items-center justify-center space-y-1 transition border border-slate-700";
                    }
                }
            });
        }

        function updateColor(hex) {
            currentColor = hex;
            document.getElementById('colorPicker').value = hex;
            document.getElementById('colorHexText').value = hex;
        }

        function initPaletteUI() {
            const paletteContainer = document.getElementById('quickPalette');
            paletteContainer.innerHTML = '';
            minecraftPalette.forEach(color => {
                const btn = document.createElement('button');
                btn.className = "w-8 h-8 rounded-md border border-slate-700 hover:scale-110 transition shadow";
                btn.style.backgroundColor = color;
                btn.onclick = () => {
                    updateColor(color);
                    setTool('pencil');
                };
                paletteContainer.appendChild(btn);
            });
        }

        function saveCurrentTexture() {
            if (!activeTextureId) return;
            const dataUrl = canvas.toDataURL();
            modifiedTextures[activeTextureId] = dataUrl;
            closeEditor();
        }

        function resetCurrentTexture() {
            if (!activeTextureId) return;
            const defaultUrl = defaultTexturesBackup[activeTextureId];
            if (defaultUrl) {
                setupCanvas(defaultUrl);
            }
        }

        function handleMultiplePngUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            let loadedCount = 0;
            Array.from(files).forEach(file => {
                const rawName = file.name.toLowerCase().replace('.png', '');
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    let matchedItem = texturesDB.find(i => i.id === rawName);
                    if (matchedItem) {
                        modifiedTextures[matchedItem.id] = dataUrl;
                    } else {
                        const newId = rawName.replace(/[^a-z0-9_]/g, '_');
                        texturesDB.push({
                            id: newId,
                            name: file.name,
                            category: 'block',
                            path: `assets/minecraft/textures/block/${file.name}`
                        });
                        modifiedTextures[newId] = dataUrl;
                        defaultTexturesBackup[newId] = dataUrl;
                    }
                    loadedCount++;
                    if (loadedCount === files.length) {
                        renderGrid();
                        updateCounts();
                        alertCustom(`${loadedCount} dosya başarıyla eklendi!`);
                    }
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        async function handlePackZipUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const zip = new JSZip();
                const zipContent = await zip.loadAsync(file);
                let count = 0;

                texturesDB = [];
                modifiedTextures = {};
                defaultTexturesBackup = {};

                for (let relativePath of Object.keys(zipContent.files)) {
                    if (relativePath.endsWith('.png') && !zipContent.files[relativePath].dir) {
                        const pathParts = relativePath.split('/');
                        const fileNameWithExt = pathParts[pathParts.length - 1];
                        const id = fileNameWithExt.replace('.png', '');

                        let category = 'block';
                        if (relativePath.includes('/item/')) category = 'item';
                        else if (relativePath.includes('/environment/')) category = 'environment';

                        const blob = await zipContent.files[relativePath].async('blob');
                        const dataUrl = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve(e.target.result);
                            reader.readAsDataURL(blob);
                        });

                        texturesDB.push({
                            id: id,
                            name: fileNameWithExt,
                            category: category,
                            path: relativePath
                        });
                        modifiedTextures[id] = dataUrl;
                        defaultTexturesBackup[id] = dataUrl;
                        count++;
                    }
                }

                renderGrid();
                updateCounts();
                alertCustom(`Yeni paket başarıyla yüklendi! (${count} dosya).`);
            } catch (err) {
                console.error("ZIP yükleme hatası:", err);
                alertCustom("Zip dosyası okunurken hata oluştu.");
            }
            event.target.value = '';
        }

        async function exportTexturePack() {
            if (texturesDB.length === 0) {
                alertCustom("Dışa aktarılacak hiç dosya yok! Önce bir paket yükleyin.");
                return;
            }
            const zip = new JSZip();
            const packName = document.getElementById('packNameInput').value || 'Benim Texture Pack';
            const packDesc = document.getElementById('packDescInput').value || 'MC Texture Studio';
            const packFormat = document.getElementById('packFormatInput').value || '22';

            const mcmeta = {
                pack: {
                    pack_format: parseInt(packFormat),
                    description: packDesc
                }
            };
            zip.file("pack.mcmeta", JSON.stringify(mcmeta, null, 2));

            const firstId = texturesDB[0].id;
            const firstDataUrl = modifiedTextures[firstId] || texturesDB[0].path;
            const base64Data = firstDataUrl.replace(/^data:image\/png;base64,/, "");
            zip.file("pack.png", base64Data, { base64: true });

            const texturesFolder = zip.folder("assets/minecraft/textures");
            const blockFolder = texturesFolder.folder("block");
            const itemFolder = texturesFolder.folder("item");
            const envFolder = texturesFolder.folder("environment");

            texturesDB.forEach(item => {
                const dataUrl = modifiedTextures[item.id];
                if (dataUrl) {
                    const b64 = dataUrl.replace(/^data:image\/png;base64,/, "");
                    if (item.category === 'item') {
                        itemFolder.file(`${item.id}.png`, b64, { base64: true });
                    } else if (item.category === 'environment') {
                        envFolder.file(`${item.id}.png`, b64, { base64: true });
                    } else {
                        blockFolder.file(`${item.id}.png`, b64, { base64: true });
                    }
                }
            });

            try {
                const content = await zip.generateAsync({ type: "blob" });
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${packName.toLowerCase().replace(/\s+/g, '_')}.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                alertCustom("Texture Pack başarıyla indirildi!");
            } catch (err) {
                console.error("Export error:", err);
                alertCustom("Zip oluşturulurken bir hata oluştu.");
            }
        }

        function openPackInfoModal() {
            document.getElementById('packInfoModal').classList.remove('hidden');
        }
        function closePackInfoModal() {
            document.getElementById('packInfoModal').classList.add('hidden');
        }

        function openCreateCustomFileDialog() {
            document.getElementById('customFileNameInput').value = '';
            document.getElementById('createCustomFileDialog').classList.remove('hidden');
        }

        function closeCreateCustomFileDialog() {
            document.getElementById('createCustomFileDialog').classList.add('hidden');
        }

        function createCustomFile() {
            const rawName = document.getElementById('customFileNameInput').value.trim().toLowerCase();
            const category = document.getElementById('customFileCategoryInput').value;
            const resolution = parseInt(document.getElementById('customFileResInput').value, 10) || 16;

            if (!rawName) {
                alertCustom("Lütfen geçerli bir dosya adı girin!");
                return;
            }

            const id = rawName.replace(/[^a-z0-9_]/g, '_');
            
            // Check if exists
            if (texturesDB.some(i => i.id === id)) {
                alertCustom("Bu isimde bir dosya zaten mevcut!");
                return;
            }

            // Create blank canvas data url
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = resolution;
            tempCanvas.height = resolution;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.clearRect(0, 0, resolution, resolution);
            const blankDataUrl = tempCanvas.toDataURL();

            let folderName = 'block';
            if (category === 'item') folderName = 'item';
            else if (category === 'environment') folderName = 'environment';

            texturesDB.push({
                id: id,
                name: `${id}.png`,
                category: category,
                path: `assets/minecraft/textures/${folderName}/${id}.png`
            });

            modifiedTextures[id] = blankDataUrl;
            defaultTexturesBackup[id] = blankDataUrl;

            renderGrid();
            updateCounts();
            closeCreateCustomFileDialog();

            alertCustom(`"${id}.png" başarıyla oluşturuldu! Çizim ekranı açılıyor...`);
            setTimeout(() => {
                openEditor(id);
            }, 300);
        }

        function alertCustom(msg) {
            const div = document.createElement('div');
            div.className = "fixed bottom-5 right-5 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-2xl z-50 flex items-center space-x-3 border border-emerald-500 animate-bounce";
            div.innerHTML = `<i class="fa-solid fa-circle-check text-lg"></i><span>${msg}</span>`;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3500);
        }

        window.onload = function() {
            initTextures();
        };

        function setThemeMode(mode) {
            currentTheme = mode;
            const body = document.getElementById('appBody');
            const header = document.getElementById('appHeader');
            const sidebar = document.querySelector('aside');
            const sidebarFooter = document.getElementById('sidebarFooter');
            const mainContainer = document.getElementById('mainContainer');
            const subHeader = document.getElementById('subHeader');
            const searchInput = document.getElementById('searchInput');

            ['dark', 'light', 'winter'].forEach(m => {
                const btn = document.getElementById(`modeBtn-${m}`);
                if (m === mode) {
                    btn.className = "py-2 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1 bg-emerald-600 text-white shadow";
                } else {
                    btn.className = "py-2 px-2 rounded-lg text-xs font-medium transition flex items-center justify-center space-x-1 text-slate-400 hover:text-slate-200";
                }
            });

            removeWinterSnow();

            if (mode === 'dark') {
                body.className = "h-full bg-slate-900 text-slate-100 font-sans flex flex-col overflow-hidden transition-colors duration-300";
                header.className = "bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shrink-0 shadow-lg transition-colors duration-300";
                if (sidebar) sidebar.className = "w-72 bg-slate-800/80 border-r border-slate-700 flex flex-col shrink-0 hidden md:flex transition-colors duration-300";
                if (sidebarFooter) sidebarFooter.className = "p-4 border-t border-slate-700 bg-slate-900/45 transition-colors duration-300";
                mainContainer.className = "flex-1 flex flex-col overflow-hidden bg-slate-950 transition-colors duration-300";
                mainContainer.style.backgroundImage = '';
                subHeader.className = "bg-slate-900/80 border-b border-slate-800 px-6 py-3 flex items-center justify-between shrink-0 transition-colors duration-300";
                if (searchInput) searchInput.className = "w-full bg-slate-900 border border-slate-700 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500";
                alertCustom("Gece Modu aktif edildi!");
            } else if (mode === 'light') {
                body.className = "h-full bg-slate-100 text-slate-800 font-sans flex flex-col overflow-hidden transition-colors duration-300";
                header.className = "bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0 shadow transition-colors duration-300";
                if (sidebar) sidebar.className = "w-72 bg-white border-r border-slate-200 flex flex-col shrink-0 hidden md:flex transition-colors duration-300";
                if (sidebarFooter) sidebarFooter.className = "p-4 border-t border-slate-200 bg-slate-50 transition-colors duration-300";
                mainContainer.className = "flex-1 flex flex-col overflow-hidden bg-slate-50 transition-colors duration-300";
                mainContainer.style.backgroundImage = '';
                subHeader.className = "bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0 transition-colors duration-300";
                if (searchInput) searchInput.className = "w-full bg-slate-100 border border-slate-300 rounded-lg pl-9 pr-4 py-2 text-sm text-slate-800 focus:outline-none focus:border-emerald-500";
                alertCustom("Aydınlık Mod aktif edildi!");
            } else if (mode === 'winter') {
                body.className = "h-full bg-slate-950 text-sky-100 font-sans flex flex-col overflow-hidden transition-colors duration-300";
                header.className = "bg-gradient-to-r from-sky-950 via-slate-900 to-sky-950 border-b border-sky-500/30 px-6 py-4 flex items-center justify-between shrink-0 shadow-2xl backdrop-blur transition-colors duration-300";
                if (sidebar) sidebar.className = "w-72 bg-slate-900/90 border-r border-sky-500/30 flex flex-col shrink-0 hidden md:flex backdrop-blur transition-colors duration-300 shadow-[inset_-10px_0_20px_-10px_rgba(56,189,248,0.15)]";
                if (sidebarFooter) sidebarFooter.className = "p-4 border-t border-sky-500/30 bg-sky-950/40 transition-colors duration-300";
                mainContainer.className = "flex-1 flex flex-col overflow-hidden transition-colors duration-300 bg-gradient-to-b from-slate-950 via-sky-950/50 to-slate-950";
                mainContainer.style.backgroundImage = "radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 60%), linear-gradient(to bottom, #020617, #082f49 50%, #020617)";
                mainContainer.style.backgroundSize = "cover";
                mainContainer.style.backgroundPosition = "center";
                
                subHeader.className = "bg-slate-900/80 border-b border-sky-500/30 px-6 py-3 flex items-center justify-between shrink-0 backdrop-blur transition-colors duration-300";
                if (searchInput) searchInput.className = "w-full bg-slate-950 border border-sky-500/40 rounded-lg pl-9 pr-4 py-2 text-sm text-sky-100 placeholder-sky-300/50 focus:outline-none focus:border-sky-400 focus:ring-2 focus:ring-sky-500/30";
                
                startWinterSnow();
                alertCustom("❄️ Büyülü Kış Modu aktif edildi!");
            }
        }

        function startWinterSnow() {
            if (winterInterval) clearInterval(winterInterval);
            winterInterval = setInterval(() => {
                if (currentTheme !== 'winter') return;
                const snowflake = document.createElement('div');
                snowflake.className = 'snowflake';
                const size = Math.random() * 8 + 3; // Ranging from small to fluffy snowflakes
                snowflake.style.width = `${size}px`;
                snowflake.style.height = `${size}px`;
                snowflake.style.left = `${Math.random() * window.innerWidth}px`;
                const duration = Math.random() * 3.5 + 2.5; // Smooth falling speed
                snowflake.style.animationDuration = `${duration}s`;
                snowflake.style.opacity = Math.random() * 0.8 + 0.2;
                document.body.appendChild(snowflake);

                setTimeout(() => {
                    snowflake.remove();
                }, duration * 1000);
            }, 80);
        }

        function removeWinterSnow() {
            if (winterInterval) {
                clearInterval(winterInterval);
                winterInterval = null;
            }
            document.querySelectorAll('.snowflake').forEach(el => el.remove());
        }
    </script>
